# Stack produksi/demo easyPOS di VPS. Dipakai bersama bundel deploy (lihat docker/install.sh).
# Konfigurasi aplikasi dibaca dari .env.docker (berisi APP_KEY, DB_PASSWORD, dll.).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: easypos
      POSTGRES_USER: easypos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dump dipulihkan otomatis HANYA saat volume masih kosong (pertama kali); setelah itu diabaikan.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypos -d easypos"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: easypos-app:demo
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: easypos
      DB_USERNAME: easypos
    volumes:
      - storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Sinkronisasi SAP (sap:sync, sap:sync-stock) dijalankan scheduler tiap menit.
  scheduler:
    image: easypos-app:demo
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: easypos
      DB_USERNAME: easypos
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy

  queue:
    image: easypos-app:demo
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: easypos
      DB_USERNAME: easypos
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: easypos-web:demo
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - storage:/var/www/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  storage:
