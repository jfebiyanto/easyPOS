map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 12m;

    # Upload (gambar produk, QR pembayaran) ada di volume storage, bukan symlink public/storage.
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Nama "app" dicari saat request (bukan saat start) agar nginx tidak mati bila app belum terdaftar di DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Di belakang reverse proxy HTTPS, teruskan skema dari proxy.
        fastcgi_param HTTPS $fcgi_https;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
