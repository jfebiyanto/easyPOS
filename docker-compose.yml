services:
  postgres:
    image: postgres:16-alpine
    container_name: easypos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: easypos
      POSTGRES_USER: easypos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-easypos_local_dev}
    ports:
      # Hanya bind ke localhost. Jangan publikasikan DB ke 0.0.0.0 di produksi.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypos -d easypos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: easypos-app
    restart: unless-stopped
    environment:
      # Override .env di dalam container (env variabel menang atas .env)
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_ENCRYPT: "true"
      # Compose ini melayani HTTP (localhost:8081) sehingga cookie Secure
      # tidak bisa dipakai. Di produksi nyata (HTTPS) hapus baris ini agar
      # cookie otomatis ber-flag Secure (default APP_ENV=production).
      SESSION_SECURE_COOKIE: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: easypos
      DB_USERNAME: easypos
      DB_PASSWORD: ${DB_PASSWORD:-easypos_local_dev}
    volumes:
      - ./:/var/www
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: easypos-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata: